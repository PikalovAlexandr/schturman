[workspace]
members = [
    "services/auth-service",
    "services/part-service",
    "services/document-service",
    "services/bom-service",
    "services/change-service",
    "services/ai-orchestrator",
    "ai-agents/semantic-search",
    "ai-agents/cad-parser",
    "ai-agents/bom-validator",
    "ai-agents/change-impact",
    "ai-agents/document-extractor",
    "ai-agents/llm-summary",
    "ai-agents/llm-tasks",
    "shared/models",
    "shared/auth",
    "shared/clients",
    "frontend/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Schturman Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/PikalovAlexandr/schturman"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# Web frameworks
axum = { version = "0.6", features = ["macros", "headers", "multipart"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace"] }

# gRPC
tonic = "0.10"
prost = "0.12"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
surrealdb = "1.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID and time
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Validation
validator = { version = "0.18", features = ["derive"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Cryptography
argon2 = "0.5"
jsonwebtoken = "9.2"

# AI/ML (temporarily disabled due to compatibility issues)
# candle-core = "0.4"
# tokenizers = "0.19"

# Vector DB
qdrant-client = "1.11"

# Message queue
async-nats = "0.33"

# Object storage
opendal = { version = "0.45", features = ["services-s3"] }

# Search
meilisearch-sdk = "0.25"

# Testing
mockall = "0.12"
